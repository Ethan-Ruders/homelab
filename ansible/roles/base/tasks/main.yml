---
- name: Ensure base packages are installed
  ansible.builtin.apt:
    name: "{{ homelab_base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Deploy unattended-upgrades homelab configuration
  ansible.builtin.copy:
    src: "{{ homelab_repo_root }}/system/51homelab-unattended"
    dest: /etc/apt/apt.conf.d/51homelab-unattended
    owner: root
    group: root
    mode: "0644"

- name: Ensure unattended-upgrades service is enabled and running
  ansible.builtin.systemd_service:
    name: unattended-upgrades
    enabled: true
    state: started

- name: Deploy base sysctl tuning configuration
  ansible.builtin.copy:
    src: "{{ homelab_repo_root }}/system/hardening/99-homelab.conf"
    dest: /etc/sysctl.d/99-homelab.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload sysctl
