---
- name: Ensure apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Check if Docker official GPG key exists
  ansible.builtin.stat:
    path: /etc/apt/keyrings/docker.asc
  register: docker_gpg_key

- name: Download Docker official GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"
  when: not docker_gpg_key.stat.exists

- name: Configure Docker apt repository
  ansible.builtin.copy:
    content: |
      deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable
    dest: /etc/apt/sources.list.d/docker.list
    owner: root
    group: root
    mode: "0644"
  notify: Update apt cache for docker

- name: Flush Docker repository handlers
  ansible.builtin.meta: flush_handlers

- name: Ensure Docker Engine and Compose plugin are installed
  ansible.builtin.apt:
    name: "{{ homelab_docker_packages }}"
    state: present

- name: Ensure homelab user belongs to docker group
  ansible.builtin.user:
    name: "{{ homelab_user }}"
    groups: docker
    append: true

- name: Deploy Docker daemon configuration
  ansible.builtin.copy:
    src: "{{ homelab_repo_root }}/system/docker-daemon.json"
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
  notify: Restart docker

- name: Ensure Docker service is enabled and running
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started

- name: Check whether shared Docker network exists
  ansible.builtin.command:
    cmd: "docker network inspect {{ homelab_docker_network }}"
  register: docker_network_check
  changed_when: false
  failed_when: false
  check_mode: false

- name: Create shared Docker bridge network if missing
  ansible.builtin.command:
    cmd: "docker network create --driver bridge {{ homelab_docker_network }}"
  when: docker_network_check.rc != 0
  changed_when: true
